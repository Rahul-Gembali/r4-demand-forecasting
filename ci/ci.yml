name: R4 Demand Forecasting CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. Backend Linting, Static Typing, and Integration Tests
  # ===========================================================================
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx

      - name: Run Ruff Linter
        run: |
          ruff check src tests scripts

      - name: Run MyPy Static Type Analysis
        run: |
          mypy src/core/monitoring.py src/core/config.py src/core/logging.py

      - name: Execute Pytest Suite (All 11 Phases)
        run: |
          pytest -v --tb=short

  # ===========================================================================
  # 2. Frontend TypeScript Compilation and Production Bundle Verification
  # ===========================================================================
  frontend-quality:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Bundle (tsc && vite build)
        working-directory: frontend
        run: npm run build

  # ===========================================================================
  # 3. Docker Image Build Verification
  # ===========================================================================
  docker-build:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-quality, frontend-quality]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: r4-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: r4-frontend:ci-test
